name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Same signing key on every build so updates install over the old app.
      # Without the DEBUG_KEYSTORE_B64 secret each build gets a fresh key (uninstall before updating).
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; fi

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dilmac.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dilmac.apk --prerelease \
            --title "Dilmaç build ${GITHUB_SHA::7}" \
            --notes "Built automatically from ${GITHUB_SHA}. Install dilmac.apk on the phone."
